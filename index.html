    <link rel="canonical" href="https://solvn.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solvn" />
    <meta property="og:title" content="Solvn — anime &amp; cartoons in HD" />
    <meta property="og:description" content="Solvn — anime &amp; cartoons in HD. One player, no installs, nothing to pay for." />

    <title>Solvn — anime &amp; cartoons in HD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poster art is the bulk of the first paint, so its DNS + TLS handshake
         starts while the stylesheet loads. The player host is deliberately not
         named here: its address lives in exactly one place (lib/sources.js), and
         the frame itself is a click or two away anyway. -->
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="dns-prefetch" href="https://graphql.anilist.co" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />
    <link rel="stylesheet" href="styles/profile.css" />
    <link rel="stylesheet" href="styles/community.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/theater.css" />
    <link rel="stylesheet" href="styles/search.css" />
    <link rel="stylesheet" href="styles/discuss.css" />
    <link rel="stylesheet" href="styles/messages.css" />
    <link rel="stylesheet" href="styles/trades.css" />
    <link rel="stylesheet" href="styles/arena.css" />
    <link rel="stylesheet" href="styles/party.css" />
    <link rel="stylesheet" href="styles/notices.css" />
    <link rel="stylesheet" href="styles/report.css" />
    <link rel="stylesheet" href="styles/art.css" />
    <link rel="stylesheet" href="styles/gacha.css" />
    <link rel="stylesheet" href="styles/sponsor.css" />
    <link rel="stylesheet" href="styles/mobile.css" />
    <link rel="stylesheet" href="styles/maintenance.css" />
    <!-- Movies & Series: the cinematic hubs and the premium player. -->
    <link rel="stylesheet" href="styles/movies.css" />
    <!-- The vibrant glass theme layer. Last, so it can re-light every sheet above
         it without any of them having to know the default palette changed. -->
    <link rel="stylesheet" href="styles/vibrant.css" />
    <!-- The material layer: transparency, rims and depth on every surface. It
         loads after the theme so its shadows win without !important. -->
    <link rel="stylesheet" href="styles/glass.css" />
    <!-- The home featured showcase: its own palette tokens and episode rail. -->
    <link rel="stylesheet" href="styles/spotlight.css" />
    <link rel="stylesheet" href="styles/kids.css" />
    <!-- The tab icon keeps the cat artwork; the startup veil and chrome now
         use the CSS wordmark and do not download it. -->
    <link rel="icon" type="image/jpeg" href="assets/solvn-cat.jpg" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-mark">
        <span class="brand-lockup splash-lockup" aria-hidden="true">
          <span class="brand-word">solvn</span>
          <span class="brand-stars" aria-hidden="true">
            <i class="brand-star brand-star--lead"></i>
            <i class="brand-star brand-star--tail"></i>
          </span>
        </span>
      </div>
    </div>

    <a class="skip-link" href="#view">Skip to content</a>

    <div class="app-shell">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
      <footer id="sitefoot" class="site-foot"></footer>
      <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
    </div>

    <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <noscript
      ><div style="padding: 2rem; color: #fff">Solvn needs JavaScript enabled.</div></noscript
    >

    <script type="module" src="js/app.js"></script>
  </body>
