<!doctype html>
<html lang="en" data-api="off">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Solvn — your ultimate destination for ultra-high-definition anime streaming. Next-gen player technology with zero limits." />
    <link rel="canonical" href="https://solvn.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solvn" />
    <meta property="og:title" content="Solvn — Watch Anime" />
    <meta property="og:description" content="Solvn — your ultimate destination for ultra-high-definition anime streaming. Next-gen player technology with zero limits." />
    <meta property="og:url" content="https://solvn.site/" />
    <meta property="og:image" content="https://solvn.site/assets/solvn-cat.jpg" />
    <meta property="og:image:width" content="736" />
    <meta property="og:image:height" content="736" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Solvn — Watch Anime" />
    <meta name="twitter:description" content="Solvn — your ultimate destination for ultra-high-definition anime streaming. Next-gen player technology with zero limits." />
    <meta name="twitter:image" content="https://solvn.site/assets/solvn-cat.jpg" />
    <title>Solvn — Watch Anime</title>
    <link rel="preload" as="image" href="assets/solvn-cat.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poster art is the bulk of the first paint, so its DNS + TLS handshake
         starts while the stylesheet loads. The player host is deliberately not
         named here: its address lives in exactly one place (lib/sources.js), and
         the frame itself is a click or two away anyway. -->
    <link rel="preconnect" href="https://s4.anilist.co" crossorigin />
    <link rel="dns-prefetch" href="https://graphql.anilist.co" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />
    <link rel="stylesheet" href="styles/profile.css" />
    <link rel="stylesheet" href="styles/level.css" />
    <link rel="stylesheet" href="styles/community.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/theater.css" />
    <link rel="stylesheet" href="styles/search.css" />
    <link rel="stylesheet" href="styles/discuss.css" />
    <link rel="stylesheet" href="styles/messages.css" />
    <link rel="stylesheet" href="styles/trades.css" />
    <link rel="stylesheet" href="styles/arena.css" />
    <link rel="stylesheet" href="styles/spin.css" />
    <link rel="stylesheet" href="styles/party.css" />
    <link rel="stylesheet" href="styles/notices.css" />
    <link rel="stylesheet" href="styles/report.css" />
    <link rel="stylesheet" href="styles/art.css" />
    <link rel="stylesheet" href="styles/gacha.css" />
    <link rel="stylesheet" href="styles/mobile.css" />
    <!-- The tab icon is the same file the splash and the chrome use, and it is
         already preloaded above, so it costs no request of its own. -->
    <link rel="icon" type="image/jpeg" href="assets/solvn-cat.jpg" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-mark">
        <div class="splash-stage">
          <img
            class="splash-cat"
            src="assets/solvn-cat.jpg"
            alt=""
            width="736"
            height="736"
            decoding="async"
            fetchpriority="high"
          />
        </div>
        <span class="splash-word">Solvn</span>
        <span class="splash-sub">Free HD Anime</span>
      </div>
    </div>

    <a class="skip-link" href="#view">Skip to content</a>

    <div class="app-shell">
      <header id="topbar" class="topbar"></header>
      <nav id="sidenav" class="sidenav" aria-label="Primary"></nav>
      <main id="view" class="view" tabindex="-1"></main>
      <footer id="sitefoot" class="site-foot"></footer>
      <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
    </div>

    <div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <noscript
      ><div style="padding: 2rem; color: #fff">Solvn needs JavaScript enabled.</div></noscript
    >

    <script type="module" src="js/app.js"></script>
  </body>
</html>
